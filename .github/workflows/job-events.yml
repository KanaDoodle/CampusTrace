name: Kafka job event acceptance

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/job-events.yml
      - Dockerfile
      - Dockerfile.search
      - Makefile
      - go.mod
      - go.sum
      - compose.kafka*.yml
      - compose.app.yml
      - compose.observability.yml
      - compose.search*.yml
      - docker-compose.yml
      - cmd/events/**
      - cmd/notify/**
      - cmd/search/**
      - cmd/worker/**
      - internal/bootstrap/**
      - internal/eventbus/**
      - internal/jobevent/**
      - internal/searchapi/**
      - internal/searchservice/**
      - internal/persistence/job*.go
      - internal/persistence/search*.go
      - internal/integration/search_online_test.go
      - internal/persistence/radar.go
      - internal/persistence/store.go
      - internal/persistence/visibility.go
      - internal/transport/monitoring.go
      - internal/persistence/recovery_state.go
      - internal/launcher/recovery*.go
      - internal/integration/recovery_epoch_test.go
      - internal/integration/kafka_test.go
      - internal/testsupport/sqlfixture/**
      - migrations/**
      - configs/observability/**
      - scripts/recovery-local.sh
      - scripts/kafka-local.sh
      - scripts/smoke-kafka.py
      - scripts/smoke-search.py
      - scripts/smoke-observability.py
      - scripts/observability-local.sh
      - scripts/adversarial-local.sh
permissions:
  contents: read
jobs:
  job-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Download pinned public modules
        run: GOWORK=off go mod download
      - name: Real SQL backup and isolated restore
        run: make recovery-test
      - name: Real Kafka and SQL transaction / consumer recovery
        run: make kafka-test
      - name: Full application, Redis continuity, replay, DLQ and traces
        run: make kafka-stack-test
      - name: Keep synthetic diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-job-events
          path: |
            bin/verification/kafka-20261031/
            bin/verification/recovery-epoch-20261031/
            bin/verification/online-rebuild-20261031/
          if-no-files-found: ignore
          retention-days: 14
