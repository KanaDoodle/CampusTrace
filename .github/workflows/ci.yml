name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The module must build against the published KanaRPC-Go release, never
      # against a sibling checkout. There is no go.work in CI, and this keeps
      # it that way even if one is added locally.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/...

      - name: Frontend tests
        run: node --test web/*.test.cjs

      - name: Verify reviewed project evidence against source
        run: python3 scripts/build-project-defense-evidence.py --check

      - name: Offline teaching-strategy review contracts
        run: python3 -m unittest discover -s scripts -p test_defense_strategy.py -v

      - name: Performance acceptance contracts
        run: make performance-test

      - name: Preparation graph tests with locked Python dependencies
        run: |
          docker build -f services/preparation/Dockerfile -t campustrace-preparation:local .
          docker run --rm -v "$PWD/services/preparation/tests:/app/tests:ro" \
            campustrace-preparation:local python -m unittest discover -s tests -v

      # Requires the pinned public KanaRPC module, with no sibling workspace or replace.
      - name: Verify published dependency boundary
        run: ./scripts/verify-release-boundary.sh

      - name: Unified CLI and complete Compose stack
        run: |
          go build -o bin/campustrace ./cmd/campustrace
          finish() {
            result=$?
            set +e
            mkdir -p bin/ci
            docker compose -f docker-compose.yml -f compose.app.yml logs --no-color --tail 200 > bin/ci/services.log 2>&1
            docker compose -f docker-compose.yml -f compose.app.yml ps --all > bin/ci/services.txt 2>&1
            for container in $(docker compose -f docker-compose.yml -f compose.app.yml ps --all --quiet); do
              docker inspect --format '{{.Name}} {{json .State}}' "$container" >> bin/ci/container-health.txt 2>&1
            done
            ./bin/campustrace stop --all
            cleanup_result=$?
            if [ "$result" -eq 0 ]; then result=$cleanup_result; fi
            exit "$result"
          }
          trap finish EXIT
          ./bin/campustrace start --timeout 180
          ./bin/campustrace start --timeout 180
          ./bin/campustrace status
          ./bin/campustrace doctor
          RADAR_RACE=1 RADAR_VERIFY_LOGS="$PWD/bin/ci/integration" ./scripts/verify-radar.sh
          ./bin/campustrace logs api --tail 3
          ./bin/campustrace stop
          ./bin/campustrace start --timeout 180

      - name: Complete synthetic application journey
        shell: bash
        run: |
          set -o pipefail
          mkdir -p bin/ci
          JOURNEY_SMOKE_OUTPUT="$PWD/bin/ci/journey.json" sh scripts/journey-local.sh smoke 2>&1 | tee bin/ci/journey.log

      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: bin/ci/
          if-no-files-found: ignore
          retention-days: 7
