name: Search fault isolation regression
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/search-resilience.yml
      - Makefile
      - go.mod
      - go.sum
      - internal/searchapi/**
      - internal/persistence/search*.go
      - internal/persistence/store.go
      - internal/bootstrap/**
      - internal/transport/search.go
      - internal/transport/monitoring.go
      - internal/transport/http.go
      - internal/integration/search*.go
      - internal/integration/kafka_test.go
      - internal/testsupport/sqlfixture/**
      - scripts/search-local.sh
      - scripts/adversarial-local.sh
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Download public pinned modules
        run: GOWORK=off go mod download
      - name: Real HTTP, SQL and OpenSearch faults with race detection
        run: |
          mkdir -p bin/verification/depth-20261031
          make resilience-test 2>&1 | tee bin/verification/depth-20261031/resilience-ci.log
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-resilience
          path: bin/verification/depth-20261031/
          retention-days: 14
          if-no-files-found: ignore
