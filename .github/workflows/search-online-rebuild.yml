name: Search online rebuild acceptance
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/search-online-rebuild.yml
      - Makefile
      - go.mod
      - go.sum
      - cmd/search/**
      - internal/searchapi/**
      - internal/searchservice/**
      - internal/eventbus/**
      - internal/persistence/search*.go
      - internal/persistence/job_dataset_recovery.go
      - internal/persistence/store.go
      - internal/integration/search*.go
      - internal/integration/kafka_test.go
      - internal/testsupport/sqlfixture/**
      - migrations/**
      - scripts/search-local.sh
      - scripts/adversarial-local.sh
permissions:
  contents: read
jobs:
  online-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
      - name: Download public pinned modules
        run: GOWORK=off go mod download
      - name: Real process kills, concurrent writes, alias reply loss and rollback
        shell: bash
        run: |
          set -o pipefail
          mkdir -p bin/verification/online-rebuild-20261031
          make online-rebuild-test 2>&1 | tee bin/verification/online-rebuild-20261031/ci.log
      - name: Preserve synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-online-rebuild
          path: bin/verification/online-rebuild-20261031/
          retention-days: 14
          if-no-files-found: ignore
