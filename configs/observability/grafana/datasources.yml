apiVersion: 1
datasources:
  - name: CampusTrace Prometheus
    uid: campustrace-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: CampusTrace Tempo
    uid: campustrace-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
