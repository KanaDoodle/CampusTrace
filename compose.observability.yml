# Optional local observability. Use with docker-compose.yml + compose.app.yml.
# Business volumes and the default startup remain unchanged.
x-tracing: &tracing
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}

services:
  api:
    environment: *tracing
  worker:
    environment: *tracing
  analysis-1:
    environment: *tracing
  analysis-2:
    environment: *tracing
  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${CAMPUS_PROMETHEUS_PORT:-19090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 15s
  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./configs/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:${CAMPUS_TEMPO_PORT:-13200}:3200"]
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Use the datasource bundled in the pinned image throughout the demo.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./configs/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/campustrace.yml:ro
      - ./configs/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/campustrace.yml:ro
      - ./configs/observability/grafana/campustrace.json:/var/lib/grafana/dashboards/campustrace.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${CAMPUS_GRAFANA_PORT:-13000}:3000"]
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
