<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>CampusTrace · 校招求职工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workbench.css"></head>
<body>
<a class="skip-link" href="#content">跳到主要内容</a>
<section id="auth" class="auth-layout"><div class="auth-intro"><div class="auth-brand">CampusTrace <small>Job Radar</small></div><h1>校招求职工作台</h1><div class="auth-steps"><span>发现岗位</span><span>核对匹配</span><span>跟进投递</span></div></div><div class="auth-form"><h2 id="auth-title">登录 CampusTrace</h2><form id="login" method="post" action="/auth/login" autocomplete="on" novalidate><label>邮箱<input aria-label="邮箱" name="email" type="email" autocomplete="username" placeholder="请输入邮箱" required></label><label>密码<span class="auth-password-field"><input id="auth-password" aria-label="密码" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button id="auth-password-toggle" type="button" class="text-btn" aria-controls="auth-password" aria-pressed="false">显示密码</button></span></label><small id="auth-password-hint" hidden>8–20 字节；字母和数字各占 1 字节。</small><div id="auth-login-options" class="auth-options"><label class="check"><input name="remember_email" type="checkbox">记住邮箱</label><label class="check"><input name="remember_login" type="checkbox">保持登录（7 天）</label></div><p id="auth-status" class="form-note" role="status" aria-live="polite"></p><div class="actions"><button id="auth-submit" type="submit" class="btn btn-primary">登录</button><button type="button" class="btn" id="register">注册账号</button></div></form></div></section>
<section id="workspace" hidden><aside class="sidebar" aria-label="工作台导航"><button class="brand" data-page="matching" aria-label="CampusTrace 岗位雷达"><svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#5550CC"/><circle cx="18" cy="18" r="10" stroke="white" stroke-opacity=".35"/><path d="M23 11a9 9 0 1 0 4 7" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="m18 18 8-8" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="18" cy="18" r="2.5" fill="white"/></svg><span>CampusTrace</span></button><button id="mobile-menu" class="icon-btn" aria-label="打开导航" aria-expanded="false" aria-controls="main-nav"><span data-icon="list"></span></button><nav id="main-nav" aria-label="主要功能"><div class="nav-label">发现与行动</div><button data-page="matching" aria-label="岗位雷达"><span data-icon="briefcase"></span><span>岗位雷达</span></button><button data-page="radar" aria-label="今日待办"><span data-icon="radar"></span><span>今日待办</span></button><button data-page="watches" aria-label="招聘来源"><span data-icon="refresh"></span><span>招聘来源</span></button><button data-page="applications" aria-label="投递进展"><span data-icon="list"></span><span>投递进展</span></button><button data-page="interviews" aria-label="面试与复盘"><span data-icon="clock"></span><span>面试与复盘</span></button><button data-page="notifications" aria-label="通知"><span data-icon="bell"></span><span>通知</span></button><button data-page="preferences" aria-label="稍后看"><span data-icon="bookmark"></span><span>稍后看</span></button><details class="nav-more"><summary>更多工具</summary><button data-page="agent" aria-label="求职问答"><span data-icon="spark"></span><span>求职问答</span></button><button data-page="knowledge" aria-label="学习资料"><span data-icon="list"></span><span>学习资料</span></button><button data-page="practice" aria-label="Go 练习"><span data-icon="spark"></span><span>Go 练习</span></button><button data-page="weak_topics" aria-label="待加强知识点"><span data-icon="list"></span><span>待加强知识点</span></button><button data-page="ingest" aria-label="录入岗位"><span data-icon="plus"></span><span>录入岗位</span></button></details><div class="nav-label nav-label-settings">个人设置</div><button data-page="profile" aria-label="求职资料"><span data-icon="person"></span><span>求职资料</span></button><button data-page="models" aria-label="模型设置"><span data-icon="spark"></span><span>模型设置</span></button></nav><button id="logout" class="sidebar-logout"><span data-icon="logout"></span><span>退出登录</span></button></aside><div class="app"><header class="topbar"><span class="breadcrumb">求职工作台 <span>/</span> <b id="crumb">岗位库</b></span></header><main id="content" tabindex="-1"></main></div></section>
<dialog id="job-drawer" class="drawer" aria-labelledby="drawer-title"></dialog><p id="notice" class="toast" role="status" aria-live="polite"></p>
<dialog id="navigation-confirm" class="modal navigation-confirm" aria-labelledby="navigation-confirm-title"><div class="modal-head"><h2 id="navigation-confirm-title">有修改尚未保存</h2></div><div class="modal-body"><p>当前有尚未保存的修改。未保留的修改会丢失；启用的本机草稿仍按本页设置保留。</p></div><div class="modal-foot"><button class="btn btn-primary" data-navigation-stay>留在此页</button><button class="btn" data-navigation-leave>离开此页</button></div></dialog>
