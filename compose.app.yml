# Add to docker-compose.yml for the complete application. The base file remains
# suitable for host development; project and volume names stay unchanged.
x-app: &app
  image: campustrace-app:local
  build:
    context: .
    args:
      GO_IMAGE: ${CAMPUS_GO_IMAGE:-golang:1.27.3-bookworm}
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &environment
    MYSQL_DSN: campus:local-campus-only@tcp(mysql:3306)/${CAMPUS_DATABASE:-campustrace}?parseTime=true&loc=UTC
    CAMPUS_REDIS_PREFIX: ${CAMPUS_REDIS_PREFIX:-ct:}
    REDIS_ADDR: redis:6379
    ETCD_ENDPOINTS: etcd:2379
    ANALYSIS_RPC_NAMESPACE: ${ANALYSIS_RPC_NAMESPACE:-/campustrace/kanarpc/v2}
    JWT_SECRET: ${JWT_SECRET:-local-campus-demo-secret-change-me-2027}
    LLM_URL: ${LLM_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    ANALYSIS_VERSION: ${ANALYSIS_VERSION:-claims-v2-semantics}
    TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:-kafka}
    KAFKA_BROKERS: kafka:9092
    KAFKA_TASK_NAMESPACE: ${KAFKA_TASK_NAMESPACE:-${CAMPUS_REDIS_PREFIX:-ct:}}
    KAFKA_TASK_PREFIX: ${KAFKA_TASK_PREFIX:-campustrace.tasks}
    TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-15}
    TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-45}
    QUEUE_CAPACITY: ${QUEUE_CAPACITY:-256}
    QUEUE_OWNER_CAPACITY: ${QUEUE_OWNER_CAPACITY:-32}
    MATCH_QUEUE_WAIT_SECONDS: ${MATCH_QUEUE_WAIT_SECONDS:-30}
    MATCH_EXECUTION_SECONDS: ${MATCH_EXECUTION_SECONDS:-175}
    MATCH_GLOBAL_CAPACITY: ${MATCH_GLOBAL_CAPACITY:-2}
    MATCH_GLOBAL_QUEUE: ${MATCH_GLOBAL_QUEUE:-64}
    MATCH_GLOBAL_OWNER_QUEUE: ${MATCH_GLOBAL_OWNER_QUEUE:-1}
    MATCH_GLOBAL_DAILY_CALLS: ${MATCH_GLOBAL_DAILY_CALLS:-400}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
  healthcheck: &health
    test: ["CMD", "/app/campustrace", "probe", "--url", "http://127.0.0.1:8080/readyz"]
    interval: 30s
    start_interval: 3s
    timeout: 4s
    retries: 30
    start_period: 10s

services:
  preparation:
    image: campustrace-preparation:local
    build:
      context: .
      dockerfile: services/preparation/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      PREPARATION_GO_URL: http://api:8080
      PREPARATION_SERVICE_TOKEN: ${PREPARATION_SERVICE_TOKEN:-local-preparation-service-change-this-2027}
      PREPARATION_CHECKPOINT_DB: /data/checkpoints.sqlite
      LANGSMITH_TRACING: "false"
      LANGGRAPH_STRICT_MSGPACK: "true"
    volumes: [preparation-checkpoints:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18110/healthz', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 10s
  api:
    <<: *app
    command: ["/app/api"]
    environment:
      <<: *environment
      HTTP_ADDR: 0.0.0.0:8080
      PREPARATION_EXECUTOR: ${PREPARATION_EXECUTOR:-langgraph}
      PREPARATION_GRAPH_URL: http://preparation:18110
      PREPARATION_SERVICE_TOKEN: ${PREPARATION_SERVICE_TOKEN:-local-preparation-service-change-this-2027}
      NARRATION_BACKEND: ${NARRATION_BACKEND:-api}
    ports: ["127.0.0.1:${CAMPUS_HTTP_PORT:-8080}:8080"]
    depends_on:
      preparation: {condition: service_healthy}
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  analysis-1:
    <<: *app
    command: ["/app/analysis"]
    environment:
      <<: *environment
      INSTANCE_ID: analysis-1
      ANALYSIS_ADDR: 0.0.0.0:19091
      ANALYSIS_ADVERTISE: analysis-1:19091
      ANALYSIS_HEALTH_ADDR: 0.0.0.0:19191
    healthcheck:
      <<: *health
      test: ["CMD", "/app/campustrace", "probe", "--url", "http://127.0.0.1:19191/readyz"]
    depends_on:
      redis: {condition: service_healthy}
      etcd: {condition: service_healthy}
  analysis-2:
    <<: *app
    command: ["/app/analysis"]
    environment:
      <<: *environment
      INSTANCE_ID: analysis-2
      ANALYSIS_ADDR: 0.0.0.0:19091
      ANALYSIS_ADVERTISE: analysis-2:19091
      ANALYSIS_HEALTH_ADDR: 0.0.0.0:19191
    healthcheck:
      <<: *health
      test: ["CMD", "/app/campustrace", "probe", "--url", "http://127.0.0.1:19191/readyz"]
    depends_on:
      redis: {condition: service_healthy}
      etcd: {condition: service_healthy}
  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *environment
      WORKER_METRICS_ADDR: 0.0.0.0:18081
      TASK_HISTORY_HOURS: ${TASK_HISTORY_HOURS:-24}
      WORKER_ANALYZE_CONCURRENCY: ${WORKER_ANALYZE_CONCURRENCY:-2}
      WORKER_ASSESS_CONCURRENCY: ${WORKER_ASSESS_CONCURRENCY:-1}
      WORKER_WATCH_FETCH_CONCURRENCY: ${WORKER_WATCH_FETCH_CONCURRENCY:-2}
      WORKER_WATCH_CHECK_CONCURRENCY: ${WORKER_WATCH_CHECK_CONCURRENCY:-1}
      WORKER_SOURCE_IMPORT_CONCURRENCY: ${WORKER_SOURCE_IMPORT_CONCURRENCY:-1}
      WORKER_SYSTEM_ANALYZE_CONCURRENCY: ${WORKER_SYSTEM_ANALYZE_CONCURRENCY:-1}
      WORKER_SYSTEM_ASSESS_CONCURRENCY: ${WORKER_SYSTEM_ASSESS_CONCURRENCY:-1}
      WORKER_SYSTEM_WATCH_CHECK_CONCURRENCY: ${WORKER_SYSTEM_WATCH_CHECK_CONCURRENCY:-1}
      WORKER_SYSTEM_WATCH_FETCH_CONCURRENCY: ${WORKER_SYSTEM_WATCH_FETCH_CONCURRENCY:-1}
      WORKER_SYSTEM_SOURCE_IMPORT_CONCURRENCY: ${WORKER_SYSTEM_SOURCE_IMPORT_CONCURRENCY:-1}
    healthcheck:
      <<: *health
      test: ["CMD", "/app/campustrace", "probe", "--url", "http://127.0.0.1:18081/healthz"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
      analysis-1: {condition: service_healthy}
      analysis-2: {condition: service_healthy}

volumes:
  preparation-checkpoints:
