# Add after compose.app.yml and compose.search.yml to enable independent
# Search and notification consumers for job-change events. Tasks share the broker.
services:
  api:
    environment:
      JOB_EVENTS_MODE: kafka
  worker:
    environment:
      JOB_EVENTS_MODE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
    networks: [default, search-rpc, job-events]
  search:
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
      KAFKA_SEARCH_GROUP: ${KAFKA_SEARCH_GROUP:-campustrace-search-v1}
    networks: [search-rpc, search-index, job-events]
  notify:
    image: campustrace-app:local
    build:
      context: .
      args:
        GO_IMAGE: ${CAMPUS_GO_IMAGE:-golang:1.27.3-bookworm}
    command: [/app/notify]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_DSN: campus:local-campus-only@tcp(mysql:3306)/${CAMPUS_DATABASE:-campustrace}?parseTime=true&loc=UTC
      NOTIFY_METRICS_ADDR: 0.0.0.0:18084
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
      KAFKA_NOTIFY_GROUP: ${KAFKA_NOTIFY_GROUP:-campustrace-notify-v1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    networks: [default, job-events]
    healthcheck:
      test: [CMD, /app/campustrace, probe, --url, 'http://127.0.0.1:18084/healthz']
      interval: 30s
      start_interval: 3s
      timeout: 4s
      retries: 30
      start_period: 10s
    depends_on:
      mysql: {condition: service_healthy}
  kafka:
    networks: [default, job-events]
  kafka-init:
    networks: [default, job-events]
networks:
  job-events:
    internal: true
