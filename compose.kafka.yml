# Add after compose.app.yml and compose.search.yml. Kafka distributes immutable
# job events; Redis keeps all existing task queues and scheduling semantics.
services:
  api:
    environment:
      JOB_EVENTS_MODE: kafka
  worker:
    environment:
      JOB_EVENTS_MODE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
    networks: [default, search-rpc, job-events]
  search:
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
      KAFKA_SEARCH_GROUP: ${KAFKA_SEARCH_GROUP:-campustrace-search-v1}
    networks: [search-rpc, search-index, job-events]
  notify:
    image: campustrace-app:local
    build:
      context: .
      args:
        GO_IMAGE: ${CAMPUS_GO_IMAGE:-golang:1.25.9-bookworm}
    command: [/app/notify]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_DSN: campus:local-campus-only@tcp(mysql:3306)/${CAMPUS_DATABASE:-campustrace}?parseTime=true&loc=UTC
      NOTIFY_METRICS_ADDR: 0.0.0.0:18084
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
      KAFKA_NOTIFY_GROUP: ${KAFKA_NOTIFY_GROUP:-campustrace-notify-v1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    networks: [default, job-events]
    healthcheck:
      test: [CMD, /app/campustrace, probe, --url, 'http://127.0.0.1:18084/healthz']
      interval: 30s
      start_interval: 3s
      timeout: 4s
      retries: 30
      start_period: 10s
    depends_on:
      mysql: {condition: service_healthy}
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    networks: [job-events]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 30s
      start_interval: 3s
      timeout: 8s
      start_period: 20s
      retries: 30
  kafka-init:
    image: apache/kafka:4.4.0
    restart: 'no'
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic "$${KAFKA_JOB_TOPIC}" --partitions 3 --replication-factor 1
        --config retention.ms=604800000 --config max.message.bytes=1048576 --config cleanup.policy=delete;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic "$${KAFKA_DLQ_TOPIC}" --partitions 3 --replication-factor 1
        --config retention.ms=604800000 --config cleanup.policy=delete
    environment:
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
    networks: [job-events]
    depends_on:
      kafka: {condition: service_healthy}
networks:
  job-events:
    internal: true
volumes:
  kafka-data:
