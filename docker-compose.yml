name: campustrace
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Bound diagnostic buffers for a personal workbench; keep instrumentation
    # and the 128 MiB InnoDB page cache enabled.
    command:
      - --max-connections=64
      - --table-open-cache=512
      - --table-definition-cache=512
      - --innodb-log-buffer-size=16777216
      - --temptable-max-ram=134217728
      - --performance-schema-digests-size=1000
      - --performance-schema-max-table-instances=1000
      - --performance-schema-max-table-handles=1000
      - --performance-schema-max-thread-instances=256
      - --performance-schema-events-statements-history-long-size=500
      - --performance-schema-events-stages-history-long-size=500
      - --performance-schema-events-waits-history-long-size=500
      - --performance-schema-events-transactions-history-long-size=500
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: campustrace
      MYSQL_USER: campus
      MYSQL_PASSWORD: local-campus-only
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      # The initialization server accepts socket connections before the real
      # TCP server or application database is ready. Check the application's
      # actual connection and credentials before starting dependent services.
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --connect-timeout=2 -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 30s
      start_interval: 3s
      start_period: 30s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 3s
      start_period: 15s
      retries: 20
  etcd:
    image: quay.io/coreos/etcd:v3.6.7
    restart: unless-stopped
    command: ["etcd", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379"]
    ports: ["127.0.0.1:12379:2379"]
    volumes: ["etcd-data:/etcd-data"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 30s
      start_interval: 3s
      start_period: 15s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:19092:19092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 30s
      start_interval: 3s
      timeout: 8s
      start_period: 20s
      retries: 30
  kafka-init:
    image: apache/kafka:4.4.0
    restart: 'no'
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for lane in analyze system_analyze assess system_assess watch_check system_watch_check watch_fetch system_watch_fetch source_import system_source_import dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${KAFKA_TASK_PREFIX}.$$lane.v1" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000 --config max.message.bytes=1048576 --config cleanup.policy=delete
        done
        for topic in "$${KAFKA_JOB_TOPIC}" "$${KAFKA_DLQ_TOPIC}"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000 --config max.message.bytes=1048576 --config cleanup.policy=delete
        done
    environment:
      KAFKA_TASK_PREFIX: ${KAFKA_TASK_PREFIX:-campustrace.tasks}
      KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-campustrace.jobs.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-campustrace.jobs.dlq.v1}
    depends_on:
      kafka: {condition: service_healthy}
volumes:
  kafka-data:
  mysql-data:
  redis-data:
  etcd-data:
